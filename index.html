<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qazo namozlarim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---------- Ranglar (yorug' rejim) ---------- */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f4f5f7);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: #4f7cff;
    --accent-soft: #e8edff;
    --track: #e9edf3;
    --border: #eceef2;
    --input-bg: #f4f6f9;
    --input-border: #dfe3ea;
    --btn-soft: #eef1f5;
    --btn-soft-text: #6b7280;
    --green: #2ecc71;
    --orange: #f59e0b;
    --red: #ef4444;
    --overlay: rgba(0, 0, 0, 0.45);
    color-scheme: light;
  }
  /* ---------- Tungi rejim ---------- */
  :root[data-theme="dark"] {
    --bg: var(--tg-theme-secondary-bg-color, #0f1114);
    --card: var(--tg-theme-bg-color, #1c1e22);
    --text: var(--tg-theme-text-color, #eceef2);
    --hint: var(--tg-theme-hint-color, #8b93a1);
    --accent: #6b93ff;
    --accent-soft: rgba(107, 147, 255, 0.16);
    --track: #2b2f36;
    --border: #2a2d33;
    --input-bg: #14161a;
    --input-border: #33373f;
    --btn-soft: #2b2f36;
    --btn-soft-text: #a4abb8;
    --green: #3ddc84;
    --orange: #fbb03b;
    --red: #f26161;
    --overlay: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { overscroll-behavior-y: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    line-height: 1.35;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 14px 18px 12px;
    max-width: 440px;
    margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 2px; text-align: center; }
  .sub { font-size: 12px; color: var(--hint); text-align: center; margin-bottom: 14px; }

  /* ---------- Umumiy taraqqiyot ---------- */
  .hero { margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .heroTop { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .heroPct { font-size: 34px; font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .heroPct.done { color: var(--green); }
  .heroInfo { text-align: right; font-size: 13px; color: var(--hint); }
  .heroInfo b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
  .bar { width: 100%; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar.big { height: 14px; }
  .bar.mini { height: 5px; margin-top: 6px; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.35s ease, background-color 0.35s ease; }
  .fill.done { background: var(--green); }

  /* ---------- Namozlar ro'yxati ---------- */
  .prayerRow {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .prayerRow:last-child { border-bottom: none; }
  .st-done { --st: var(--green); }
  .st-near { --st: var(--accent); }
  .st-mid  { --st: var(--orange); }
  .st-high { --st: var(--red); }
  .pName { font-size: 16px; font-weight: 600; }
  .prayerRow .fill { background: var(--st); }
  .pCount {
    font-size: 24px; font-weight: 700; color: var(--st); min-width: 60px; text-align: center;
    cursor: pointer; font-variant-numeric: tabular-nums; padding: 2px 4px;
    border-bottom: 1px dashed var(--input-border);
  }
  .pBtns { display: flex; gap: 8px; }
  .pBtn {
    width: 42px; height: 42px; border-radius: 12px; border: none; font-size: 18px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .pBtn:active { transform: scale(0.94); }
  .pBtn.minus { background: var(--accent); color: #fff; }
  .pBtn.plus { background: var(--btn-soft); color: var(--btn-soft-text); }

  /* ---------- Maqsad ---------- */
  .goal { margin-top: 8px; padding: 14px; background: var(--input-bg); border-radius: 14px; }
  .goalTitle { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .goalRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .goalRow input {
    width: 68px; padding: 9px 10px; font-size: 16px; text-align: center; font-weight: 600;
    border: 1px solid var(--input-border); border-radius: 10px; background: var(--card); color: var(--text);
  }
  .seg { display: flex; background: var(--track); border-radius: 10px; padding: 3px; }
  .seg button {
    border: none; background: none; color: var(--hint); font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--text); }
  .goalUnit { font-size: 13px; color: var(--hint); }
  .goalDone {
    display: none; width: 100%; margin-top: 10px; padding: 11px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .goal.editing .goalDone { display: block; }
  .goalResult { margin-top: 12px; font-size: 14px; line-height: 1.4; }
  .goalResult b { color: var(--accent); font-size: 16px; }
  .goalResult .small { display: block; font-size: 12px; color: var(--hint); margin-top: 2px; }
  .goalResult.done b { color: var(--green); }

  .status { font-size: 12px; text-align: center; margin-top: 12px; min-height: 16px; font-weight: 600; }
  .status.ok { color: var(--green); }
  .status.fail { color: var(--red); }

  .footerBtns { display: flex; gap: 8px; margin-top: 8px; }
  .linkBtn {
    flex: 1; padding: 11px 8px; font-size: 13px; color: var(--hint); background: none;
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  }

  /* ---------- Pastda yana narsa borligini bildiruvchi ishora ---------- */
  .scrollHint {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    cursor: pointer; z-index: 6; border: none;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .scrollHint.show { opacity: 1; pointer-events: auto; }
  .scrollHint .arrow { display: inline-block; animation: hintBounce 1.2s ease-in-out infinite; }
  @keyframes hintBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* ---------- Sozlash / tahrirlash oynalari ---------- */
  .overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  .overlayCard {
    background: var(--card); color: var(--text); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px;
    max-height: 100%; overflow-y: auto;
  }
  .overlayCard h2 { font-size: 17px; margin: 0 0 14px; text-align: center; }
  .setupRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .setupRow label { font-size: 14px; flex: 1; }
  .setupRow input {
    width: 100px; padding: 9px 10px; border: 1px solid var(--input-border); border-radius: 10px;
    font-size: 16px; text-align: right; background: var(--input-bg); color: var(--text);
  }
  .dateCalc { background: var(--input-bg); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .dateCalcHint { font-size: 12px; color: var(--hint); margin-bottom: 10px; line-height: 1.4; }
  .dateCalc .setupRow input[type="date"] { width: 150px; font-size: 14px; }
  .calcBtn { background: var(--accent-soft) !important; color: var(--accent) !important; border-radius: 10px; padding: 11px; font-weight: 600; margin-top: 4px; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
  .overlayBtn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }
  .overlayBtnSecondary {
    width: 100%; padding: 11px; border: none; background: none; color: var(--hint);
    font-size: 13px; cursor: pointer; margin-top: 6px;
  }
  .editInput {
    width: 100%; padding: 12px; font-size: 18px; text-align: center; border: 1px solid var(--input-border);
    border-radius: 10px; margin-bottom: 10px; background: var(--input-bg); color: var(--text);
  }
</style>
</head>
<body>
<div class="card">
  <h1>🕌 Qazo namozlarim</h1>
  <div class="sub">Har o'qiganingizda "−1" tugmasini bosing</div>

  <div class="hero">
    <div class="heroTop">
      <div class="heroPct" id="progressPct">0%</div>
      <div class="heroInfo">
        Qoldi: <b id="totalRemaining">0</b><br>
        <span id="doneInfo">o'qilgan 0 / 0</span>
      </div>
    </div>
    <div class="bar big"><div class="fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div id="prayerList"></div>

  <div class="goal" id="goalBox">
    <div class="goalTitle">🎯 Maqsad</div>
    <div class="goalRow">
      <input type="number" inputmode="numeric" id="goalInput" min="1" placeholder="5">
      <span class="goalUnit">dona</span>
      <div class="seg">
        <button type="button" id="unitDay" class="on" onclick="setGoalUnit('day')">kuniga</button>
        <button type="button" id="unitWeek" onclick="setGoalUnit('week')">haftasiga</button>
      </div>
    </div>
    <button type="button" class="goalDone" onclick="dismissKeyboard()">✓ Tayyor</button>
    <div class="goalResult" id="goalResult"></div>
  </div>

  <div class="status" id="statusMsg"></div>
  <div class="footerBtns">
    <button class="linkBtn" onclick="openSetup(true)">⚙️ Sonlarni sozlash</button>
    <button class="linkBtn" onclick="copyReportText()">📋 Nusxalash</button>
  </div>
</div>

<button type="button" class="scrollHint" id="scrollHint" onclick="scrollToFooter()">
  <span>Yana pastda</span><span class="arrow">⌄</span>
</button>

<div class="overlay hidden" id="setupOverlay">
  <div class="overlayCard">
    <h2>Qazo namozlar sonini kiriting</h2>

    <div class="dateCalc">
      <div class="dateCalcHint">Aniq sonni bilmasangiz — ikkita sanani kiriting, kunlar sonidan avtomatik hisoblab beramiz (har kunga 5 vaqt):</div>
      <div class="setupRow">
        <label>Farz bo'lgan sana</label>
        <input type="date" id="calcStart">
      </div>
      <div class="setupRow">
        <label>Muntazam boshlagan sana</label>
        <input type="date" id="calcEnd">
      </div>
      <button class="overlayBtnSecondary calcBtn" onclick="calcFromDates()">📅 Hisoblash va to'ldirish</button>
    </div>

    <div class="divider"></div>

    <div id="setupFields"></div>
    <button class="overlayBtn" onclick="saveSetup()">Saqlash</button>
    <button class="overlayBtnSecondary" id="cancelSetupBtn" onclick="closeSetup()" style="display:none;">Bekor qilish</button>
  </div>
</div>

<div class="overlay hidden" id="editOverlay">
  <div class="overlayCard">
    <h2 id="editLabel">Qolgan sonni kiriting</h2>
    <input type="number" inputmode="numeric" id="editInput" class="editInput">
    <button class="overlayBtn" onclick="saveEdit()">Saqlash</button>
    <button class="overlayBtnSecondary" onclick="closeEdit()">Bekor qilish</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  // Pastga surganda ilova yopilib ketmasligi uchun (Telegram 7.7+)
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

/* ---------- Tema (dark mode) ---------- */
function applyTheme() {
  let scheme = "light";
  if (tg && tg.colorScheme) scheme = tg.colorScheme;
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) scheme = "dark";
  document.documentElement.setAttribute("data-theme", scheme);
  if (tg) {
    try {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (bg) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
    } catch (e) {}
  }
}
applyTheme();
if (tg && tg.onEvent) tg.onEvent("themeChanged", applyTheme);
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", () => { if (!tg) applyTheme(); });
}

let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const tag = event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const now = Date.now();
  if (now - lastTouchEnd <= 350) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', function (event) { event.preventDefault(); });

const PRAYERS = [
  { key: "bomdod", name: "Bomdod" },
  { key: "peshin", name: "Peshin" },
  { key: "asr", name: "Asr" },
  { key: "shom", name: "Shom" },
  { key: "xufton", name: "Xufton" }
];

const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];

const hasCloud = !!(tg && tg.CloudStorage);

function cloudGet(key) {
  return new Promise((resolve) => {
    if (!hasCloud) return resolve(localStorage.getItem(key));
    tg.CloudStorage.getItem(key, (err, value) => {
      if (err) resolve(localStorage.getItem(key));
      else resolve(value || null);
    });
  });
}
function cloudSet(key, value) {
  return new Promise((resolve, reject) => {
    try { localStorage.setItem(key, value); } catch(e) {}
    if (!hasCloud) return resolve(true);
    tg.CloudStorage.setItem(key, value, (err, success) => {
      if (err || !success) reject(new Error(err || "CloudStorage rad etdi"));
      else resolve(true);
    });
  });
}

function origKey(k) { return "qazo_orig_" + k; }
function remKey(k) { return "qazo_rem_" + k; }
const GOAL_KEY = "qazo_goal";
const GOAL_UNIT_KEY = "qazo_goal_unit";

let data = {}; // { bomdod: {orig, rem}, ... }
let goal = { value: null, unit: "day" };

function fmt(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function setStatus(msg, cls) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "status" + (cls ? " " + cls : "");
}

async function loadAll() {
  for (const p of PRAYERS) {
    const [origRaw, remRaw] = await Promise.all([cloudGet(origKey(p.key)), cloudGet(remKey(p.key))]);
    data[p.key] = {
      orig: origRaw !== null ? Number(origRaw) : null,
      rem: remRaw !== null ? Number(remRaw) : null
    };
  }
  const [goalRaw, unitRaw] = await Promise.all([cloudGet(GOAL_KEY), cloudGet(GOAL_UNIT_KEY)]);
  const g = Number(goalRaw);
  goal.value = goalRaw !== null && g > 0 ? g : null;
  goal.unit = unitRaw === "week" ? "week" : "day";
}

function needsSetup() {
  return PRAYERS.some(p => data[p.key].orig === null);
}

/* Holat: qolgan ulush bo'yicha rang */
function stateClass(orig, rem) {
  if (rem === 0) return "st-done";
  const share = orig > 0 ? rem / orig : 1;
  if (share > 0.66) return "st-high";
  if (share > 0.33) return "st-mid";
  return "st-near";
}

function render() {
  const list = document.getElementById("prayerList");
  list.innerHTML = "";
  let totalOrig = 0, totalRem = 0;

  PRAYERS.forEach(p => {
    const orig = data[p.key].orig || 0;
    const rem = data[p.key].rem !== null ? data[p.key].rem : orig;
    totalOrig += orig;
    totalRem += rem;

    const donePart = orig > 0 ? Math.min(1, Math.max(0, (orig - rem) / orig)) : (rem === 0 ? 1 : 0);
    const donePct = Math.round(donePart * 100);

    const row = document.createElement("div");
    row.className = "prayerRow " + stateClass(orig, rem);
    row.innerHTML = `
      <div class="pInfo">
        <div class="pName">${p.name}</div>
        <div class="bar mini"><div class="fill" style="width:${donePct}%"></div></div>
      </div>
      <div class="pCount" onclick="editCount('${p.key}')">${fmt(rem)}</div>
      <div class="pBtns">
        <button class="pBtn plus" onclick="bump('${p.key}', 1)">+</button>
        <button class="pBtn minus" onclick="bump('${p.key}', -1)">−1</button>
      </div>`;
    list.appendChild(row);
  });

  const doneTotal = Math.max(0, totalOrig - totalRem);
  const pct = totalOrig > 0 ? Math.min(100, Math.round((doneTotal / totalOrig) * 100)) : 0;
  const allDone = totalOrig > 0 && totalRem === 0;

  document.getElementById("totalRemaining").textContent = fmt(totalRem);
  document.getElementById("doneInfo").textContent = "o'qilgan " + fmt(doneTotal) + " / " + fmt(totalOrig);
  const pctEl = document.getElementById("progressPct");
  pctEl.textContent = pct + "%";
  pctEl.className = "heroPct" + (allDone ? " done" : "");
  const fillEl = document.getElementById("progressFill");
  fillEl.style.width = pct + "%";
  fillEl.className = "fill" + (allDone ? " done" : "");

  renderGoal(totalRem);
  updateScrollHint();
}

/* ---------- Maqsad va taxminiy tugash muddati ---------- */
function formatDuration(days) {
  if (days >= 365) {
    const y = Math.floor(days / 365);
    const m = Math.round((days % 365) / 30);
    return y + " yil" + (m > 0 ? " " + m + " oy" : "");
  }
  if (days >= 30) {
    const m = Math.floor(days / 30);
    const d = days % 30;
    return m + " oy" + (d > 0 ? " " + d + " kun" : "");
  }
  return days + " kun";
}

function formatDate(d) {
  return d.getFullYear() + "-yil " + d.getDate() + "-" + MONTHS[d.getMonth()];
}

function renderGoal(totalRem) {
  const input = document.getElementById("goalInput");
  if (document.activeElement !== input) input.value = goal.value !== null ? goal.value : "";
  document.getElementById("unitDay").classList.toggle("on", goal.unit === "day");
  document.getElementById("unitWeek").classList.toggle("on", goal.unit === "week");

  const box = document.getElementById("goalResult");
  box.className = "goalResult";

  if (totalRem === 0 && needsSetup() === false) {
    box.classList.add("done");
    box.innerHTML = "<b>Alhamdulillah!</b> 🎉<span class='small'>Barcha qazolar tugadi</span>";
    return;
  }
  if (!goal.value) {
    box.innerHTML = "<span class='small'>Necha dona o'qishni rejalashtirsangiz — qachon tugashini hisoblab beramiz (1 dona = 1 vaqt namoz)</span>";
    return;
  }
  const perDay = goal.unit === "week" ? goal.value / 7 : goal.value;
  const days = Math.ceil(totalRem / perDay);
  const finish = new Date();
  finish.setDate(finish.getDate() + days);
  box.innerHTML = "Taxminan <b>" + fmt(days) + " kunda</b> tugaydi" +
    "<span class='small'>" + formatDuration(days) + " • " + formatDate(finish) + "</span>";
}

async function saveGoal() {
  try {
    await cloudSet(GOAL_KEY, goal.value ? String(goal.value) : "");
    await cloudSet(GOAL_UNIT_KEY, goal.unit);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
}

function currentTotalRem() {
  return PRAYERS.reduce((sum, p) => {
    const orig = data[p.key].orig || 0;
    return sum + (data[p.key].rem !== null ? data[p.key].rem : orig);
  }, 0);
}

function setGoalUnit(unit) {
  goal.unit = unit;
  renderGoal(currentTotalRem());
  saveGoal();
}

document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("goalInput");
  input.addEventListener("input", () => {
    const v = Math.floor(Number(input.value));
    goal.value = v > 0 ? v : null;
    renderGoal(currentTotalRem());
  });
  input.addEventListener("change", saveGoal);

  const box = document.getElementById("goalBox");
  input.addEventListener("focus", () => {
    box.classList.add("editing");
    setTimeout(() => box.scrollIntoView({ block: "center", behavior: "smooth" }), 300);
  });
  input.addEventListener("blur", () => box.classList.remove("editing"));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
});

function dismissKeyboard() {
  const el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) el.blur();
  saveGoal();
}

// Maydondan tashqariga bosilsa klaviatura yopiladi
document.addEventListener("click", (e) => {
  const el = document.activeElement;
  if (!el || el.tagName !== "INPUT") return;
  if (e.target === el || e.target.closest("button, label, .overlayCard")) return;
  el.blur();
});

/* ---------- Saqlash va tahrirlash ---------- */
async function persist(key, rem) {
  setStatus("Saqlanmoqda...", "");
  try {
    await cloudSet(remKey(key), String(rem));
    setStatus("Saqlandi ✓", "ok");
    setTimeout(() => setStatus("", ""), 1000);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
}

async function bump(key, delta) {
  const orig = data[key].orig || 0;
  let rem = data[key].rem !== null ? data[key].rem : orig;
  rem = Math.max(0, rem + delta);
  data[key].rem = rem;
  render();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  await persist(key, rem);
}

async function editCount(key) {
  const current = data[key].rem !== null ? data[key].rem : (data[key].orig || 0);
  const label = PRAYERS.find(p => p.key === key).name;
  openEditOverlay(key, label, current);
}

function openEditOverlay(key, label, current) {
  const overlay = document.getElementById("editOverlay");
  document.getElementById("editLabel").textContent = label + " — qolgan sonni kiriting";
  const input = document.getElementById("editInput");
  input.value = current;
  overlay.dataset.key = key;
  overlay.classList.remove("hidden");
  setTimeout(() => input.focus(), 50);
  updateScrollHint();
}

function closeEdit() {
  document.getElementById("editOverlay").classList.add("hidden");
  updateScrollHint();
}

async function saveEdit() {
  const overlay = document.getElementById("editOverlay");
  const key = overlay.dataset.key;
  const num = Math.max(0, Number(document.getElementById("editInput").value) || 0);
  data[key].rem = num;
  closeEdit();
  render();
  await persist(key, num);
}

function showMsg(text) {
  if (tg && tg.showAlert) tg.showAlert(text);
  else alert(text);
}

function calcFromDates() {
  const startVal = document.getElementById("calcStart").value;
  const endVal = document.getElementById("calcEnd").value;
  if (!startVal || !endVal) {
    showMsg("Iltimos, ikkala sanani ham kiriting.");
    return;
  }
  const start = new Date(startVal);
  const end = new Date(endVal);
  const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24));
  if (diffDays <= 0) {
    showMsg("Muntazam boshlagan sana farz bo'lgan sanadan keyin bo'lishi kerak.");
    return;
  }
  PRAYERS.forEach(p => {
    document.getElementById("setup_" + p.key).value = diffDays;
  });
}

function openSetup(isEdit) {
  const overlay = document.getElementById("setupOverlay");
  const fields = document.getElementById("setupFields");
  fields.innerHTML = "";
  PRAYERS.forEach(p => {
    const val = data[p.key].orig !== null ? data[p.key].orig : "";
    const row = document.createElement("div");
    row.className = "setupRow";
    row.innerHTML = `<label>${p.name}</label><input type="number" inputmode="numeric" id="setup_${p.key}" value="${val}" placeholder="0">`;
    fields.appendChild(row);
  });
  document.getElementById("cancelSetupBtn").style.display = isEdit ? "block" : "none";
  overlay.classList.remove("hidden");
  updateScrollHint();
}

function closeSetup() {
  document.getElementById("setupOverlay").classList.add("hidden");
  updateScrollHint();
}

async function saveSetup() {
  for (const p of PRAYERS) {
    const input = document.getElementById("setup_" + p.key);
    const newOrig = Math.max(0, Number(input.value) || 0);
    const prevOrig = data[p.key].orig;
    const prevRem = data[p.key].rem;

    let newRem;
    if (prevOrig === null) {
      // Birinchi marta sozlanmoqda
      newRem = newOrig;
    } else if (newOrig !== prevOrig) {
      // Foydalanuvchi sonni qo'lda o'zgartirdi — farqni qolganiga ham qo'shib/ayirib qo'yamiz
      const diff = newOrig - prevOrig;
      newRem = Math.max(0, (prevRem !== null ? prevRem : prevOrig) + diff);
    } else {
      newRem = prevRem !== null ? prevRem : newOrig;
    }

    data[p.key].orig = newOrig;
    data[p.key].rem = newRem;
    await cloudSet(origKey(p.key), String(newOrig));
    await cloudSet(remKey(p.key), String(newRem));
  }
  closeSetup();
  render();
  setStatus("Saqlandi ✓", "ok");
  setTimeout(() => setStatus("", ""), 1200);
}

function buildReportText() {
  const today = new Date();
  const dateStr = today.toLocaleDateString("uz-UZ") || today.toISOString().slice(0,10);
  let lines = [];
  lines.push("Qazo namozlarim hisoboti");
  lines.push("Sana: " + dateStr);
  lines.push("");
  let totalOrig = 0, totalRem = 0;
  PRAYERS.forEach(p => {
    const orig = data[p.key].orig || 0;
    const rem = data[p.key].rem !== null ? data[p.key].rem : orig;
    const done = orig - rem;
    totalOrig += orig; totalRem += rem;
    lines.push(p.name + ": boshlang'ich " + orig + ", qolgan " + rem + ", o'qilgan " + done);
  });
  lines.push("");
  lines.push("Jami boshlang'ich: " + totalOrig);
  lines.push("Jami qolgan: " + totalRem);
  lines.push("Jami o'qilgan: " + (totalOrig - totalRem));
  return lines.join("\n");
}

function copyReportText() {
  const text = buildReportText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      setStatus("Nusxalandi ✓ — istalgan joyga joylashtiring", "ok");
      setTimeout(() => setStatus("", ""), 2000);
    }).catch(() => {
      showMsg(text);
    });
  } else {
    showMsg(text);
  }
}

function scrollToFooter() {
  document.querySelector(".footerBtns").scrollIntoView({ block: "end", behavior: "smooth" });
}

function updateScrollHint() {
  const hint = document.getElementById("scrollHint");
  const overlayOpen = !document.getElementById("setupOverlay").classList.contains("hidden") ||
                       !document.getElementById("editOverlay").classList.contains("hidden");
  const hasMore = document.documentElement.scrollHeight > window.innerHeight + 40;
  const nearBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 30;
  hint.classList.toggle("show", hasMore && !nearBottom && !overlayOpen);
}
window.addEventListener("scroll", updateScrollHint, { passive: true });
window.addEventListener("resize", updateScrollHint);

async function init() {
  await loadAll();
  if (needsSetup()) {
    openSetup(false);
  }
  render();
  setTimeout(updateScrollHint, 200);
}

init();
</script>
